<svg width="100%" viewBox="0 0 900 280" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Sourabh Raghuwanshi — Full Stack Developer</title>
<desc>Animated banner with perspective grid, glitch text, and floating code particles</desc>
<defs>
  <style>
    @keyframes drift { 0%{transform:translateY(0)} 100%{transform:translateY(-280px)} }
    @keyframes glitch1 { 0%,90%,100%{transform:translate(0,0);opacity:1} 92%{transform:translate(-4px,1px);opacity:.8} 96%{transform:translate(3px,-1px);opacity:.9} }
    @keyframes glitch2 { 0%,88%,100%{transform:translate(0,0);opacity:0} 89%{transform:translate(5px,0);opacity:.5} 94%{transform:translate(-3px,0);opacity:.4} }
    @keyframes glitch3 { 0%,85%,100%{transform:translate(0,0);opacity:0} 86%{transform:translate(-6px,2px);opacity:.35} 93%{transform:translate(4px,-1px);opacity:.3} }
    @keyframes scanline { 0%{transform:translateY(-10px)} 100%{transform:translateY(290px)} }
    @keyframes pulse { 0%,100%{opacity:.4} 50%{opacity:.9} }
    @keyframes fadein { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
    .p1{animation:drift 8s linear infinite}
    .p2{animation:drift 12s linear infinite;animation-delay:-4s}
    .p3{animation:drift 10s linear infinite;animation-delay:-7s}
    .p4{animation:drift 15s linear infinite;animation-delay:-2s}
    .p5{animation:drift 9s linear infinite;animation-delay:-9s}
    .name-main{animation:glitch1 6s ease-in-out infinite}
    .name-g1{animation:glitch2 6s ease-in-out infinite}
    .name-g2{animation:glitch3 6s ease-in-out infinite}
    .scan{animation:scanline 3s linear infinite}
    .dot{animation:pulse 2s ease-in-out infinite}
    .sub{animation:fadein .8s ease-out 0.4s both}
    .links{animation:fadein .8s ease-out 0.9s both}
  </style>
  <clipPath id="clip"><rect width="900" height="280"/></clipPath>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#020818"/>
    <stop offset="100%" stop-color="#050d28"/>
  </linearGradient>
  <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#020818" stop-opacity="1"/>
    <stop offset="100%" stop-color="#020818" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="glow-h" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#7c3aed" stop-opacity="0"/>
    <stop offset="30%" stop-color="#7c3aed" stop-opacity=".7"/>
    <stop offset="70%" stop-color="#06b6d4" stop-opacity=".7"/>
    <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
  </linearGradient>
</defs>
<g clip-path="url(#clip)">
  <rect width="900" height="280" fill="url(#sky)"/>
  <g opacity=".22" stroke="#06b6d4" stroke-width=".6" fill="none">
    <line x1="450" y1="148" x2="0" y2="280"/>
    <line x1="450" y1="148" x2="60" y2="280"/>
    <line x1="450" y1="148" x2="140" y2="280"/>
    <line x1="450" y1="148" x2="220" y2="280"/>
    <line x1="450" y1="148" x2="300" y2="280"/>
    <line x1="450" y1="148" x2="380" y2="280"/>
    <line x1="450" y1="148" x2="450" y2="280"/>
    <line x1="450" y1="148" x2="520" y2="280"/>
    <line x1="450" y1="148" x2="600" y2="280"/>
    <line x1="450" y1="148" x2="680" y2="280"/>
    <line x1="450" y1="148" x2="760" y2="280"/>
    <line x1="450" y1="148" x2="840" y2="280"/>
    <line x1="450" y1="148" x2="900" y2="280"/>
  </g>
  <g opacity=".2" stroke="#06b6d4" stroke-width=".6" fill="none">
    <line x1="0" y1="280" x2="900" y2="280"/>
    <line x1="30" y1="262" x2="870" y2="262"/>
    <line x1="72" y1="244" x2="828" y2="244"/>
    <line x1="118" y1="226" x2="782" y2="226"/>
    <line x1="168" y1="210" x2="732" y2="210"/>
    <line x1="218" y1="196" x2="682" y2="196"/>
    <line x1="268" y1="184" x2="632" y2="184"/>
    <line x1="308" y1="174" x2="592" y2="174"/>
    <line x1="340" y1="166" x2="560" y2="166"/>
    <line x1="370" y1="159" x2="530" y2="159"/>
    <line x1="400" y1="153" x2="500" y2="153"/>
  </g>
  <rect x="0" y="145" width="900" height="6" fill="url(#glow-h)" opacity=".8"/>
  <rect width="900" height="165" fill="url(#fade)" opacity=".85"/>
  <g font-family="monospace" font-size="11" fill="#06b6d4" opacity=".5">
    <g class="p1"><text x="42"  y="280">const</text></g>
    <g class="p2"><text x="110" y="200">async</text></g>
    <g class="p3"><text x="790" y="240">=></text></g>
    <g class="p4"><text x="640" y="190">[]</text></g>
    <g class="p5"><text x="200" y="260">{}</text></g>
  </g>
  <g font-family="monospace" font-size="11" fill="#7c3aed" opacity=".45">
    <g class="p2"><text x="720" y="280">import</text></g>
    <g class="p3"><text x="320" y="210">export</text></g>
    <g class="p1"><text x="550" y="260">return</text></g>
    <g class="p4"><text x="80"  y="230">await</text></g>
    <g class="p5"><text x="860" y="220">fn()</text></g>
  </g>
  <rect class="scan" x="0" y="0" width="900" height="2" fill="#7c3aed" opacity=".12"/>
  <g stroke="#06b6d4" stroke-width="1.5" fill="none" opacity=".7">
    <polyline points="18,32 18,18 32,18"/>
    <polyline points="868,32 868,18 854,18"/>
    <polyline points="18,248 18,262 32,262"/>
    <polyline points="868,248 868,262 854,262"/>
  </g>
  <g fill="#7c3aed">
    <circle class="dot" cx="28" cy="140" r="2.5"/>
    <circle class="dot" cx="872" cy="140" r="2.5" style="animation-delay:.8s"/>
  </g>
  <text class="name-g2" x="450" y="115" text-anchor="middle"
    font-family="'Courier New',monospace" font-size="58" font-weight="700"
    fill="#ff00cc" letter-spacing="4">SOURABH RAGHUWANSHI</text>
  <text class="name-g1" x="450" y="115" text-anchor="middle"
    font-family="'Courier New',monospace" font-size="58" font-weight="700"
    fill="#00ffff" letter-spacing="4">SOURABH RAGHUWANSHI</text>
  <text class="name-main" x="450" y="115" text-anchor="middle"
    font-family="'Courier New',monospace" font-size="58" font-weight="700"
    fill="#ffffff" letter-spacing="4">SOURABH RAGHUWANSHI</text>
  <text class="sub" x="450" y="148" text-anchor="middle"
    font-family="'Courier New',monospace" font-size="13.5" fill="#94a3b8" letter-spacing="3">
    FULL STACK DEVELOPER  ·  REACT  ·  VUE  ·  NEXT.JS  ·  NODE.JS
  </text>
  <g class="links">
    <rect x="270" y="192" width="360" height="26" rx="3" fill="#0f172a" opacity=".8" stroke="#1e293b" stroke-width=".5"/>
    <circle cx="292" cy="205" r="4" fill="#06b6d4" class="dot"/>
    <text x="305" y="209" font-family="'Courier New',monospace" font-size="11.5" fill="#64748b" letter-spacing="1">
      OPEN TO OPPORTUNITIES  //  INDORE, INDIA
    </text>
  </g>
</g>
</svg>
